name: CI/CD Pipeline for Tourism Prediction

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-train:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Configure Hugging Face Token
        run: |
          echo "HF_TOKEN=${{ secrets.HF_TOKEN }}" >> $GITHUB_ENV

      - name: Run Data Preparation Script
        run: |
          python model_building/prep.py
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}

      - name: Run Model Training and Registration Script
        run: |
          python model_building/train.py
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}

      # You can add more steps here, e.g., model evaluation, deployment to a specific environment.
      # For deployment to Hugging Face Spaces (which the hosting.py script does),
      # you might integrate it as a separate job or within this one.

  deploy-to-hf-spaces:
    needs: build-and-train
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install dependencies for hosting
        run: |
          python -m pip install --upgrade pip
          pip install huggingface_hub

      - name: Configure Hugging Face Token
        run: |
          echo "HF_TOKEN=${{ secrets.HF_TOKEN }}" >> $GITHUB_ENV

      - name: Run Deployment Script to Hugging Face Spaces
        run: |
          python hosting/hosting.py
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}

